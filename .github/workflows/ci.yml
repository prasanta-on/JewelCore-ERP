name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build & Test Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: jewelcore
          POSTGRES_PASSWORD: jewelcore_dev
          POSTGRES_DB: jewelcore_erp
        ports:
          - 5434:5432
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5434
      POSTGRES_USER: jewelcore
      POSTGRES_PASSWORD: jewelcore_dev
      POSTGRES_DB: jewelcore_erp
      DATABASE_URL: postgres://jewelcore:jewelcore_dev@localhost:5434/jewelcore_erp
      NODE_ENV: test
      JWT_SECRET: jewelcore-test-jwt-secret-key-32-chars-long!
      PORT: 4000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Build Monorepo
        run: pnpm build

      - name: Run Monorepo Test Suites
        run: pnpm test
